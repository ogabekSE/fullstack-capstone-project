<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Deployed Landing Page - GiftLink</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f6f7fb;
        margin: 0;
      }
      .browser {
        background: #e9eef8;
        padding: 10px 12px;
        box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.05);
      }
      .address {
        background: #fff;
        border-radius: 6px;
        padding: 8px 12px;
        display: inline-block;
        width: 70%;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }
      .container {
        max-width: 800px;
        margin: 40px auto;
        text-align: center;
      }
      .card {
        background: #fff;
        border-radius: 10px;
        padding: 48px 36px;
        box-shadow: 0 8px 30px rgba(17, 24, 39, 0.06);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 36px;
        color: #0b2b4a;
      }
      p.lead {
        margin: 0 0 20px;
        color: #4b5563;
        font-size: 18px;
      }
      .btn {
        display: inline-block;
        padding: 12px 22px;
        background: #0066cc;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      .meta {
        margin-top: 18px;
        color: #9aa3b2;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="browser">
      <div
        style="
          max-width: 980px;
          margin: 0 auto;
          display: flex;
          align-items: center;
          gap: 12px;
        "
      >
        <div
          style="
            width: 12px;
            height: 12px;
            background: #ff5f56;
            border-radius: 50%;
          "
        ></div>
        <div
          style="
            width: 12px;
            height: 12px;
            background: #ffbd2e;
            border-radius: 50%;
          "
        ></div>
        <div
          style="
            width: 12px;
            height: 12px;
            background: #27c93f;
            border-radius: 50%;
          "
        ></div>
        <div class="address">https://github.com/ogabekSE/fullstack-capstone-project</div>
      </div>
    </div>

    <div class="container">
      <div class="card">
        <h1>GiftLink</h1>
        <p class="lead">
          Find free items or give away household goods to your community.
        </p>
        <a class="btn" href="#">Get Started</a>
        <div class="meta">
          Project title: GiftLink — Tagline and Get Started button visible. Repository: https://github.com/ogabekSE/fullstack-capstone-project
        </div>
      </div>
    </div>
  </body>
</html>
